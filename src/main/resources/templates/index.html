<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="main-header">
    <h1>SmartFile Sorter</h1>
    <p>AI-powered organization. Drag, drop, and let the AI suggest where your files belong.</p>
</header>

<div class="dashboard-container">
    <div id="pendingPane" class="pane">
        <h2>Pending Files</h2>

        <div id="dropZone" class="box">
            <p>Drag & Drop here or click to upload</p>
            <input type="file" id="fileInput" multiple class="hidden-input" />

            <div id="stagingArea">
                <ul id="stagingList"></ul>
            </div>
        </div>

        <div class="staging-controls mt-20">
            <button id="uploadAllBtn" class="hidden">Upload All Staged Files</button>
            <button id="clearStagedBtn" class="btn-danger hidden">Clear Staged Files</button>
        </div>

        <div class="scrollable-content">
            <div id="fileList"></div>
        </div>
    </div>

    <div class="pane">
        <div id="suggestionsPane">
        </div>
    </div>

    <div id="explorerPane" class="pane">
        <div id="explorerHeader" class="header-flex">
            <h2>File Explorer</h2>
            <button id="collapseAllBtn" class="auto-width">Collapse All</button>
        </div>
        <div id="explorerContent"></div>
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
