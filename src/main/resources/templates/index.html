<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <div id="suggestionsPane" class="pane"><h2>Suggestions</h2></div>
    <div id="pendingPane" class="pane">
        <h2>Pending</h2>
        <div id="dropZone" class="box">
            <p>Drag & Drop files here or click to upload</p>
            <input type="file" id="fileInput" style="display:none;" />
        </div>
        <div id="fileList"></div>
    </div>
    <div id="explorerPane" class="pane"><h2>Explorer</h2></div>
</div>
<script src="scripts.js"></script>
</body>
</html>
