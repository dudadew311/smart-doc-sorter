<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="main-header">
    <h1>SmartFile Sorter</h1>
    <p>AI-powered organization. Drag, drop, and let the AI suggest where your files belong.</p>
</header>

<div class="dashboard-container">
    <div id="pendingPane" class="pane">
        <h2>Pending Files</h2>

        <div id="dropZone" class="box" style="border: 2px dashed #cbd5e1; padding: 20px; text-align: center; cursor: pointer;">
            <p>Drag & Drop here or click to upload</p>
            <input type="file" id="fileInput" multiple style="display:none;" />
        </div>

        <div id="stagingArea" style="margin-top: 20px;">
            <h3>Staged for Upload</h3>
            <ul id="stagingList"></ul>
            <div style="display:flex; gap: 10px;">
                <button id="uploadAllBtn" style="display:none;">Upload All Staged Files</button>
                <button id="clearStagedBtn" style="display:none; background-color: #ef4444; color: white;">Clear Staged Files</button>
            </div>
        </div>

        <div id="fileList"></div>
    </div>

    <div id="suggestionsPane" class="pane">
        <h2>AI Suggestions</h2>
        <p class="guide">Select a file to see intelligent folder suggestions.</p>
    </div>

    <div id="explorerPane" class="pane">
        <h2>File Explorer</h2>
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
